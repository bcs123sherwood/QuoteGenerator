<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Generator</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png" />
    <link rel="manifest" href="favicon_io/site.webmanifest" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

<!-- Navigation -->
    <div class="nav-container">
      <a href="favorites.html" class="nav-button">My Favorites</a>
    </div>
    <div class="nav-container left-nav">
      <a href="addquote.html" class="nav-button">Add Quote</a>
    </div>

<!-- Start of Quote Container -->
    <div class="quote-container" id="quote-container">
<!-- Favorite Button -->
      <button class="favorite-button" id="favorite" title="Add to Favorites">
        <i class="far fa-star"></i>
      </button>
      
<!-- Quote -->
      <div class="quote-text">
        <i class="fas fa-quote-left"></i>
        <span id="quote"></span>
      </div>

<!-- Author -->
      <div class="quote-author">
        <span id="author"></span>
      </div>

<!-- Buttons -->
      <div class="button-container">
        <button class="x-button" id="twitter" title="Share on X">
          <i class="fa-brands fa-x-twitter"></i>
        </button>
        <button id="new-quote">New Quote</button>
      </div>
    </div> 

<!-- Loader -->
    <div class="loader" id="loader"></div>

<!-- End of Quote Container -->

<!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
